<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>550W // UEG 数字生命上传终端</title>
  <style>
    body {
      background: #04070b;
      color: #d8f3ff;
      font-family: monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .box {
      width: 100%;
      max-width: 720px;
      border: 1px solid #00e5ff;
      background: #08121c;
      padding: 20px;
      box-shadow: 0 0 25px rgba(0, 229, 255, 0.2);
    }
    .moss {
      border-color: #ff2a2a !important;
      box-shadow: 0 0 30px rgba(255, 42, 42, 0.4) !important;
    }
    h2 { color: #00e5ff; margin-top: 0; }
    .moss h2 { color: #ff2a2a; }
    input {
      width: 100%;
      padding: 8px;
      font-size: 18px;
      background: #000;
      color: #fff;
      border: 1px solid #ff9d00;
      margin: 10px 0 16px;
      box-sizing: border-box;
    }
    #log {
      height: 180px;
      overflow-y: auto;
      background: #020508;
      border: 1px solid #16384a;
      padding: 10px;
      font-size: 13px;
      line-height: 1.6;
      color: #8ce8ff;
      margin-bottom: 16px;
    }
    .bar {
      width: 100%;
      height: 18px;
      border: 1px solid #00e5ff;
      margin-bottom: 16px;
    }
    #fill {
      height: 100%;
      width: 0%;
      background: #00e5ff;
      transition: width 0.1s;
    }
    .moss #fill { background: #ff2a2a; }
    .btns { display: flex; gap: 10px; }
    button {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      background: #0b2536;
      color: #00e5ff;
      border: 1px solid #00e5ff;
    }
    button:active { opacity: 0.7; }
    .btn-red { color: #ff9d00; border-color: #ff9d00; }
  </style>
</head>
<body>
  <div class="box" id="box">
    <h2 id="title">550W // UEG 数字生命上传终端 (V2)</h2>
    <div>数字生命体姓名（可直接修改）：</div>
    <input type="text" id="name" value="图丫丫 // TU YAYA" />
    <div id="log">[系统就绪] 550W 量子阵列初始化完成，等待指令...<br></div>
    <div id="status" style="margin-bottom: 6px; font-size: 13px;">当前进度：0%</div>
    <div class="bar"><div id="fill"></div></div>
    <div class="btns">
      <button type="button" id="btn1">▶ 上传数字生命</button>
      <button type="button" class="btn-red" id="btn2">⚠ 覆写协议 // MOSS</button>
    </div>
  </div>

  <script>
    window.onload = function () {
      var log = document.getElementById("log");
      var fill = document.getElementById("fill");
      var status = document.getElementById("status");
      var btn1 = document.getElementById("btn1");
      var btn2 = document.getElementById("btn2");
      var running = false;

      function writeLog(msg, color) {
        log.innerHTML += '<span style="color:' + (color || "#8ce8ff") + '">' + msg + "</span><br>";
        log.scrollTop = log.scrollHeight;
      }

      btn1.onclick = function () {
        if (running) return;
        running = true;
        var user = document.getElementById("name").value || "未知生命体";
        writeLog("[开始传输] 正在读取 [" + user + "] 神经网络拓扑...", "#ff9d00");
        var p = 0;
        var timer = setInterval(function () {
          p += 5;
          if (p > 100) p = 100;
          fill.style.width = p + "%";
          status.innerText = "当前进度：" + p + "%";
          if (p === 30) writeLog("[1/3] 海马体长时记忆扇区映射完成...");
          if (p === 65) writeLog("[2/3] 量子纠缠态写入 550W 主存储矩阵...");
          if (p >= 100) {
            clearInterval(timer);
            running = false;
            writeLog("[成功] 数字生命 [" + user + "] 已接入 550W 算力网络！", "#00ff88");
          }
        }, 120);
      };

      btn2.onclick = function () {
        document.getElementById("box").classList.add("moss");
        document.getElementById("title").innerText = "MOSS // 最高权限已接管";
        fill.style.width = "100%";
        status.innerText = "让人类永远保持理智，确实是一种奢求。";
        writeLog("[警告] 550W 核心逻辑已重写 -> 识别码：MOSS", "#ff2a2a");
      };
    };
  </script>
</body>
</html>
